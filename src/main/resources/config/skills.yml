claw:
  global-tools:
    - memory_manage
    - time_query
    - skill_knowledge_manage
    - web_search

  skills:
    common:
      enabled: true
      priority: 0
      tags: [通用]
      requiredTools: []
      optionalTools:
        - create_schedule_task
        - list_schedule_tasks
        - update_schedule_task
        - cancel_schedule_task
        - web_search
        - holiday_check
      systemPromptResource: prompts/skills/common.txt
      knowledge:
        enabled: false
        namespaces: []
        topK: 0
        minScore: 0.0
        maxContextChars: 0

    campus:
      enabled: true
      priority: 4
      tags: [校园, 课程]
      description: 校园课程管理。导入/查询/修改/删除个人课表，管理考试安排与考试提醒。适用于课表导入、课程查询、考试安排等校园事务。
      requiredTools: []
      optionalTools:
        - course_schedule
        - exam_schedule
        - exam_reminder_setup
      systemPromptResource: prompts/skills/campus.txt
      knowledge:
        enabled: false
        namespaces: []
        topK: 0
        minScore: 0.0
        maxContextChars: 0

    travel:
      enabled: true
      priority: 5
      tags: [出行, 方案]
      requiredTools:
        - travel_collect
        - travel_save_options
        - travel_select_option
        - travel_revise
        - travel_calculate_cost
      optionalTools:
        - map_search_place
        - map_route_planning
        - map_distance_calculate
        - weather_query
        - holiday_check
        - transport_recommend
        - place_image_search
        - web_search
      systemPromptResource: prompts/skills/travel.txt
      triggerPolicyName: travelTriggerPolicy
      knowledge:
        enabled: false
        namespaces: [travel]
        topK: 5
        minScore: 0.50
        maxContextChars: 12000

    transport:
      enabled: true
      priority: 4
      tags: [出行, 打车]
      requiredTools:
        - transport_recommend
      optionalTools:
        - didi_ride
        - map_search_place
        - map_route_planning
        - map_distance_calculate
        - web_search
      systemPromptResource: prompts/skills/transport.txt
      triggerPolicyName: transportTriggerPolicy
      knowledge:
        enabled: false
        namespaces: [transport]
        topK: 3
        minScore: 0.50
        maxContextChars: 6000

    weather:
      enabled: true
      priority: 2
      tags: [天气]
      requiredTools: [weather_query]
      optionalTools: [web_search]
      systemPromptResource: prompts/skills/weather.txt
      triggerPolicyName: keywordTriggerPolicy

    anime:
      enabled: true
      priority: 4
      tags: [动漫, 番剧]
      description: 动漫番剧订阅与推荐。管理追番列表、搜索番剧、订阅/取消订阅、查询播出时间、推荐当季新番。
      requiredTools: []
      optionalTools:
        - anime_recommend
        - anime_subscribe
      systemPromptResource: prompts/skills/anime.txt
      knowledge:
        enabled: false
        namespaces: []
        topK: 0
        minScore: 0.0
        maxContextChars: 0

    information-scout:
      enabled: true
      priority: 3
      description: 创建信息猎手持续关注任务，后台定期发现与用户兴趣、项目和目标相关的高价值资讯并推送；仅在用户明确要求持续关注/订阅新动态、趋势或机会时触发，现场即时查询请用 web_search。
      tags: [信息, 搜索]
      requiredTools: []
      optionalTools: []
      systemPromptResource: prompts/skills/information-scout.txt
      triggerPolicyName: scoutTriggerPolicy
      execution:
        mode: BACKGROUND_WORKFLOW
        executorName: informationScoutSkillExecutor
      knowledge:
        enabled: false
        namespaces: [scout]
        topK: 3
        minScore: 0.50
        maxContextChars: 6000

  workflows:
    scoutWorkflow:
      workerName: scoutWorkflowWorker
      timeout: 30m
      retryMax: 3
      cron: 0 0 8 * * *

  skill-workflow-bindings:
    information-scout: scoutWorkflow
