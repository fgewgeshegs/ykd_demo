# ============================================
# File Parse Configuration
# ============================================
file.parse.max-file-size=10485760
file.parse.max-text-length=30000
file.parse.max-embedded-images=5
file.parse.max-analyzed-embedded-images=3

# ============================================
# Tencent Map Configuration
# ============================================
# Tencent Location Service (lbs.qq.com) API Key
tencent.key=${TENCENT_MAP_KEY:}

# ============================================
# Context Memory Configuration
# ============================================
# Context storage type: in-memory (lost on restart) | sqlite (persistent)
# memory.type=sqlite
# sqlite.path=./data/claw-memory.db
# sqlite.max-messages=50

place-image.provider=pexels

# ============================================
# Pexels API Configuration
# ============================================
# Pexels free API Key registration: https://www.pexels.com/api/
pexels.api-key=

# ============================================
# SQLite DataSource (Spring JDBC + SqliteContextStore)
# ============================================
spring.datasource.url=jdbc:sqlite:data/claw.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# ============================================
# Campus Exam Reminder
# ============================================
campus.enabled=true

storage.enabled=true

# ============================================
# Long-Term Memory (Qdrant + BGE-M3)
# ============================================
# Master switch
memory.enabled=true
# Memory importance threshold: below this value won't be stored (0.0~1.0)
memory.importance-threshold=0.3
# Number of memories recalled each time (Top-K)
memory.recall-top-k=5
# Minimum recall similarity: below this threshold, memories won't be injected
memory.recall-min-score=0.45
# First recall more candidates, then sort by relevance, importance, and recency
memory.recall-candidate-multiplier=3
# Recency half-life for general memories (days)
memory.recency-half-life-days=180
# Memory extraction thread pool per user
memory.async-core-size=1
memory.async-max-size=2
memory.async-queue-capacity=50
# Dedup similarity threshold: above this value is considered duplicate
memory.dedup-similarity=0.90
# Minimum message length: below this, extraction is skipped
memory.min-extract-length=10

# Qdrant vector database
memory.qdrant.host=localhost
memory.qdrant.port=6334
memory.qdrant.collection=claw_memories
memory.qdrant.vector-dimension=1024

# Embedding model (BGE-M3, requires OpenAI-compatible /v1/embeddings endpoint)
memory.embedding.base-url=http://localhost:11434
memory.embedding.api-key=
memory.embedding.model=bge-m3
memory.embedding.dimension=1024

# ============================================
# Didi MCP Configuration
# ============================================
# Didi Chuxing MCP Server (JSON-RPC 2.0 protocol)
# Register to get API Key: https://mcp.didichuxing.com
# Sandbox environment returns mock data, does not affect real accounts
didi.mcp.base-url=https://mcp.didichuxing.com/mcp-servers-sandbox
didi.mcp.api-key=
didi.mcp.timeout=15000

# ============================================
# Information Scout Agent
# ============================================
# Master switch
scout.enabled=true
# Minimum semantic match score (0.0-1.0)
scout.min-match-score=0.45
# Strict threshold no result fallback score
scout.fallback-match-score=0.25
# Fallback candidate count
scout.fallback-candidate-count=8
# Only recommend information published within this many days
scout.freshness-days=14
# Maximum candidate count per retrieval
scout.max-candidates=20
# Maximum recommendations per retrieval
scout.max-recommendations=10
# Minimum recommendations when candidates are sufficient
scout.min-recommendations=8
# Information retention days
scout.ttl-days=7
# Number of search tasks
scout.search-task-count=5
# Maximum results per search task
scout.max-results-per-task=10
# Cooldown period (days) before pushing the same info again
scout.delivery-cooldown-days=30
# Scheduled task cron expression (daily at 8:00 AM)
scout.cron=0 0 8 * * *

# Qdrant scout information collection (separate from memory collection)
scout.qdrant.collection=scout_information
scout.qdrant.vector-dimension=1024

# RSS feeds
scout.rss.enabled=true
scout.rss.freshness-days=7
scout.rss.feeds[0]=https://openai.com/news/rss.xml
scout.rss.feeds[1]=https://spring.io/blog.atom
scout.rss.feeds[2]=https://github.blog/feed/
scout.rss.feeds[3]=https://hnrss.org/frontpage

# ============================================
# Skill System
# ============================================
spring.config.import=classpath:config/skills.yml

skill.enabled=true

# Routing
skill.routing.fallback-mode=COMMON
skill.routing.session-inactive-limit=5
skill.routing.session-timeout-minutes=30
skill.routing.llm-router-enabled=true
skill.routing.llm-router-timeout-seconds=5

# Knowledge RAG
skill.knowledge.collection=skill_knowledge
skill.knowledge.recall-top-k=5
skill.knowledge.min-score=0.50
skill.knowledge.recall-candidate-multiplier=3
skill.knowledge.max-context-chars=12000
skill.knowledge.max-chunk-chars=3000

# Workflow
workflow.retry-max=3
workflow.timeout-minutes=30
workflow.scout.cron=0 0 8 * * *

anime.enabled=true
anime.seasonRecommendation.enabled=true